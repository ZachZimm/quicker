[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quicker"
version = "0.1.0"
description = "Document review and rental bookkeeping preparation for Quicken"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "python-multipart>=0.0.20", "httpx>=0.28,<1", "pillow>=11,<13", "pillow-heif>=0.21,<2"]

[project.optional-dependencies]
client = ["PySide6>=6.8,<7", "platformdirs>=4,<5"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2", "pyinstaller>=6,<7"]

[project.scripts]
quicker = "quicker.cli:main"
quicker-client = "quicker_client.app:main"

[tool.setuptools]
package-dir = {quicker = "server/quicker", quicker_client = "client/quicker_client"}
packages = ["quicker", "quicker_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.package-data]
quicker = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
